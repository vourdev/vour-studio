# Refreshes the offline copy of the blog that ships inside the build.
#
# `lib/data/posts.generated.ts` is what /blog serves when api-studio, the VPS or
# the database is unreachable, so it has to be committed -- a build that fetched
# it at deploy time would depend on the very thing the fallback exists to
# survive.
#
# Last known good: the generator exits non-zero on a response it does not trust,
# which fails this job and commits nothing. The previous snapshot stays exactly
# where it was, and the failure is visible here rather than discovered on the
# day of an outage.
name: Snapshot blog fallback

on:
  schedule:
    # 02:00 WIB, two hours after the blog generator's own cron, so the newest
    # article is already published when this runs.
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot-blog
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate snapshot
        env:
          CMS_API_URL: ${{ secrets.CMS_API_URL }}
        run: |
          test -n "$CMS_API_URL" || { echo "CMS_API_URL secret is not set"; exit 1; }
          npm run snapshot:blog

      # tsc is the gate that catches a snapshot the type system rejects, which
      # would otherwise break the next deploy rather than this job.
      - name: Typecheck
        run: npm run typecheck

      - name: Commit if changed
        run: |
          if git diff --quiet -- lib/data/posts.generated.ts; then
            echo "snapshot unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/posts.generated.ts
          git commit -m "chore(blog): refresh offline snapshot

          Generated by .github/workflows/snapshot-blog.yml."
          git push
